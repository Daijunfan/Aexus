<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aexus</title><link rel="icon" href="./aexus.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./collaboration.css"></head><body><div class="app"><header class="toolbar"><div class="toolbar-brand"><h1><img src="./aexus.png" alt="">Aexus</h1></div><div class="mode-switch" aria-label="Workspace views · drag to reorder"><button id="single-mode" data-id="single" draggable="true" class="active" title="Drag to reorder views">Single Host</button><button id="hosts-board-mode" data-id="hosts-board" draggable="true" title="Drag to reorder views">Hosts Board</button><button id="agent-board-mode" data-id="agent-board" draggable="true" title="Drag to reorder views">Agent Board</button><button id="role-board-mode" data-id="role-board" draggable="true" title="Drag to reorder views">Role Board</button></div><div class="toolbar-actions"><label class="language-switch" title="Interface language"><select id="language-select" aria-label="Interface language"><option value="en" selected>English</option><option value="zh">中文</option></select></label><button id="station">File Station</button><button id="refresh" disabled>Refresh Status</button><button id="add" disabled class="primary">+ Add Host</button></div></header><div class="layout-handle top-resizer" data-resize="toolbar" role="separator" aria-label="Resize toolbar" aria-orientation="horizontal" aria-valuemin="36" aria-valuemax="72" tabindex="0"></div><div id="message" role="status" aria-live="polite"></div><main><aside><label class="search-label"><input id="search" type="search" placeholder="Search hosts or systems" aria-label="Search hosts"></label><div class="list-heading">My Hosts <span id="count">0</span></div><div id="hosts"></div><div class="fleet-status"><i class="lamp online"></i><strong id="online-count">0</strong> hosts last reachable</div><p class="sidebar-note">Check connections manually.</p></aside><div class="layout-handle side-resizer" data-resize="sidebar" role="separator" aria-label="Resize sidebar" aria-orientation="vertical" aria-valuemin="52" aria-valuemax="460" tabindex="0"></div><section id="detail"></section><section id="remote-workbench" hidden></section></main></div><script src="./bundle.js"></script></body></html>
